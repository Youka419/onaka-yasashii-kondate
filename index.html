<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="description" content="胃に負担の少ない献立、使っていい食材、家族のお買い物リスト">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="献立ノート">
  <title>おなかにやさしい献立ノート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="mark" src="icons/icon.svg" alt="" width="40" height="40">
        <div>
          <p class="brand-kicker">家族の料理メモ</p>
          <h1 class="brand-title">おなかにやさしい献立ノート</h1>
        </div>
      </div>
    </header>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <nav class="tabs" aria-label="画面">
      <button type="button" class="tab" data-tab="meals" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>今日の献立</span>
      </button>
      <button type="button" class="tab" data-tab="foods">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 11 12 4 20 5c-1 9-8 14-15 14z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 15c2-2 4-5 6-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>食材ガイド</span>
      </button>
      <button type="button" class="tab" data-tab="shopping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2l2.2 11h9.6L20 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span>お買い物</span>
        <span class="badge" id="shop-badge" hidden>0</span>
      </button>
    </nav>
    <main id="panel" tabindex="-1"></main>
    <p class="disclaimer">料理のメモです。食事の制限は医師・薬剤師の指示が優先です。</p>
  </div>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
